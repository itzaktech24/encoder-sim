<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-label="Bx and By vector decomposition and arctangent angle">
  <rect width="400" height="400" fill="#05070B"/>
  <!-- axes -->
  <line x1="40" y1="330" x2="378" y2="330" stroke="#33415C" stroke-width="1.4"/>
  <line x1="40" y1="330" x2="40" y2="30" stroke="#33415C" stroke-width="1.4"/>
  <text x="368" y="350" fill="#8B97AB" font-size="11" font-family="monospace">Bx</text>
  <text x="18" y="42" fill="#8B97AB" font-size="11" font-family="monospace">By</text>
  <!-- vector at 40° -->
  <g>
    <line x1="40" y1="330" x2="308" y2="104" stroke="#34D399" stroke-width="3"/>
    <polygon points="308,104 286,110 302,127" fill="#34D399"/>
    <!-- projections -->
    <line x1="308" y1="104" x2="308" y2="330" stroke="#22D3EE" stroke-width="1.6" stroke-dasharray="5 4"/>
    <line x1="308" y1="104" x2="40"  y2="104" stroke="#FBBF24" stroke-width="1.6" stroke-dasharray="5 4"/>
    <text x="182" y="325" fill="#22D3EE" font-size="12" font-family="monospace">Bx = |B|·cosθ</text>
    <text x="44" y="96" fill="#FBBF24" font-size="12" font-family="monospace">By = |B|·sinθ</text>
    <!-- angle arc -->
    <path d="M 108 330 A 68 68 0 0 0 92 276" fill="none" stroke="#E2E8F0" stroke-width="1.6"/>
    <text x="112" y="300" fill="#E2E8F0" font-size="13" font-family="monospace">θ</text>
    <text x="150" y="200" fill="#34D399" font-size="12" font-family="monospace">|B|</text>
    <text x="40" y="380" fill="#5C6879" font-size="10" font-family="monospace">θ = atan2(By, Bx) — the quantity every encoder reports</text>
  </g>
</svg>
